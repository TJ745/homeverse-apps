id: forgejo
name: Forgejo
version: 17.0.0
tagline: Your own place to keep code, issues and releases
description: >-
  A software forge that runs on this device: repositories, issues, pull
  requests and releases, for one person or for a few. Everything stays here,
  and nothing is shared with anybody you did not invite.
category: developer
developer: The Forgejo contributors
website: https://forgejo.org
source: https://codeberg.org/forgejo/forgejo
license: GPL-3.0-or-later
mainService: forgejo
internalPort: 3000
proxyAuth: true
arch: [amd64, arm64]
requirements: { ramMb: 256, diskMb: 2000 }
permissions: []
extraPorts: []
secrets: []
dependencies: []
exports: {}
backup: { strategy: stop, exclude: [] }
defaultCredentials: null
releaseNotes: >-
  First release in the HomeVerse store. Browsing code, issues, pull requests
  and releases all work. Cloning and pushing do not yet: this app sits behind
  the same door as the rest of the device, and that door asks a browser to
  sign in, which git cannot do. Until that is settled, use it to read and
  manage what is here rather than as the thing you push to.
