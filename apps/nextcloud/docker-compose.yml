services:
  nextcloud:
    image: nextcloud:35.0.2-apache@sha256:a588aa5353703b44106a6129adaaf7bf22521b7a4754f9f529b3228d6aa390c5
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      # A single file rather than a database server of its own. One app, one
      # file, nothing else to run and nothing else to back up.
      SQLITE_DATABASE: nextcloud
      # The administrator this device makes on first start. The password is
      # derived from the device's own key, so it differs on every device and
      # is written down in no store; the dashboard shows it on this app's
      # page, which is the only place it exists.
      NEXTCLOUD_ADMIN_USER: homeverse
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Nextcloud refuses a request whose Host it does not recognise, which
      # would otherwise be the first thing anybody saw.
      NEXTCLOUD_TRUSTED_DOMAINS: ${DEVICE_DOMAIN} ${APP_PUBLIC_HOST}
      # Every request arrives through Caddy, so the links Nextcloud builds
      # have to be the ones a browser outside the container can follow.
      OVERWRITEHOST: ${APP_PUBLIC_HOST}
      OVERWRITEPROTOCOL: http
      TRUSTED_PROXIES: 127.0.0.1/32
    volumes:
      - ${APP_DATA_DIR}/html:/var/www/html
      - ${APP_DATA_DIR}/data:/var/www/html/data
    ports:
      - "127.0.0.1:${APP_HOST_PORT}:80"
    healthcheck:
      # status.php answers before anybody signs in, and says whether the
      # install finished — which is what makes it usable as a health check
      # without a person in a browser. The body matters: it answers 200 while
      # still installing, with "installed":false.
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:80/status.php | grep -q '\"installed\":true'",
        ]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 120s
