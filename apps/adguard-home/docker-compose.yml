services:
  # Writes the first configuration, so that installing this app does not hand
  # somebody a questionnaire. AdGuard Home has no environment variables for
  # any of this: without a configuration file it serves a setup wizard
  # instead of its own web interface, and nothing would answer a health check
  # until a person had been through it.
  #
  # It runs before the app, writes the file only if it is not already there,
  # and stops. Everything it sets can be changed afterwards in AdGuard's own
  # settings, and this never overwrites those.
  set-up:
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/conf:/opt/adguardhome/conf
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ -f /opt/adguardhome/conf/AdGuardHome.yaml ]; then
        echo "HomeVerse: AdGuard Home is already configured, leaving it alone.";
        else
        printf '%s\n'
        'http:'
        '  address: 0.0.0.0:3000'
        '# No password of its own: this app is reached through the device'"'"'s'
        '# door, which the dashboard already guards, and its port is not'
        '# published to the network.'
        'users: []'
        'dns:'
        '  bind_hosts:'
        '    - 0.0.0.0'
        '  port: 53'
        '  upstream_dns:'
        '    - https://dns.quad9.net/dns-query'
        '  bootstrap_dns:'
        '    - 9.9.9.10'
        '    - 149.112.112.10'
        'filtering:'
        '  protection_enabled: true'
        'schema_version: 29'
        > /opt/adguardhome/conf/AdGuardHome.yaml;
        echo "HomeVerse: wrote the first configuration.";
        fi

  adguard-home:
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    restart: unless-stopped
    depends_on:
      set-up:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
    volumes:
      - ${APP_DATA_DIR}/conf:/opt/adguardhome/conf
      - ${APP_DATA_DIR}/work:/opt/adguardhome/work
    ports:
      - "127.0.0.1:${APP_HOST_PORT}:3000"
      # Every device on the network asks this port, so unlike the web
      # interface it is published to the network rather than to loopback.
      - "53:53/udp"
      - "53:53/tcp"
    healthcheck:
      # Answers as soon as it is serving, with no wizard in the way, which is
      # what the configuration above is for.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/control/status | grep -q version"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 30s
